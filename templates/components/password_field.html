{# Password input with show/hide toggle. Usage: {% include "components/password_field.html" with field=form.password %} #}
<div class="fta-field">
  <label class="fta-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
  <div class="fta-password">
    <input type="password" name="{{ field.html_name }}" id="{{ field.id_for_label }}"
           class="fta-input{% if field.errors %} is-invalid{% endif %}"
           autocomplete="current-password" required
           {% if field.errors %}aria-invalid="true" aria-describedby="{{ field.id_for_label }}-error"{% endif %}>
    <button type="button" class="fta-password__toggle" data-password-toggle="{{ field.id_for_label }}"
            aria-controls="{{ field.id_for_label }}" aria-pressed="false">Show</button>
  </div>
  {% if field.errors %}
    <p class="fta-field__error" id="{{ field.id_for_label }}-error">{{ field.errors|first }}</p>
  {% endif %}
</div>
